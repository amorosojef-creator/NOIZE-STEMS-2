name: Build NOIZE for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Engine self-tests
        run: build\noize_tests_artefacts\Release\noize_tests.exe
      - name: Package
        shell: pwsh
        run: |
          cmake --install build --config Release --component app --prefix dist/NOIZE
          Compress-Archive -Path dist/NOIZE/* -DestinationPath dist/NOIZE-portable.zip -Force
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /DSRC_DIR="$PWD\dist\NOIZE" installer\noize.nsi
          Move-Item installer\NOIZE-*-Setup.exe dist\NOIZE-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: NOIZE-windows
          path: |
            dist/NOIZE-portable.zip
            dist/NOIZE-Setup.exe
